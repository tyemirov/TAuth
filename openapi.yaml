openapi: 3.1.0
info:
  title: TAuth OAuth Authorization Server
  version: 1.0.0
  description: >-
    OAuth authorization and owner-scoped tenant management. Management collections
    use ascending ID order, limit from 1 through 100 (default 50), and cursor from
    the previous next_cursor. All management responses use no-store. Cookie
    mutations require the exact console Origin and X-TAuth-CSRF value 1.
    Missing preconditions return 428. Stale preconditions return 412. Changed
    idempotency payloads return 409. Invalid activation returns a typed error
    with details.activation and a Location for its persisted failed resource.
servers:
  - url: https://auth.example.com
paths:
  /auth/apple/native:
    post:
      operationId: authenticateNativeApple
      description: Exchange the authorization code, verify both Apple ID tokens, and issue a session after encrypted grant storage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [apple_id_token, authorization_code, nonce_token]
              properties:
                apple_id_token: {type: string}
                authorization_code: {type: string}
                nonce_token: {type: string}
                full_name: {type: object, additionalProperties: {type: string}}
      responses:
        "200": {description: The authenticated public user profile and session cookies.}
        "400": {description: Invalid JSON or a missing authorization code or nonce.}
        "401": {description: Invalid identity or an authorization code exchange mismatch.}
        "403": {description: The user is not allowed.}
        "404": {description: Native Apple authentication is disabled.}
        "503": {description: The encrypted grant cannot be stored. No session is issued.}
  /auth/apple/notifications:
    post:
      operationId: acceptAppleNotification
      description: Verify an Apple event with the explicit notification audience and record its durable receipt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [payload]
              properties:
                payload: {type: string, maxLength: 65536}
      responses:
        "204": {description: The verified event was processed. Stale or ambiguous events cannot complete erasure.}
        "400": {description: Invalid JSON or notification size.}
        "401": {description: Invalid signature, issuer, audience, or event data.}
        "503": {description: Notification persistence is unavailable.}
  /auth/account:
    patch:
      operationId: correctAccountProfile
      description: >-
        Correct the display name of the authenticated active tenant account.
        The tenant must enable account management. The session cookie name is tenant-specific.
        The server keeps the override across provider login. Email and all other input fields are unsupported.
      parameters:
        - name: X-TAuth-Tenant
          in: header
          required: false
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [display_name]
              properties:
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: The server removes outer whitespace and rejects control characters.
      responses:
        "200":
          description: The current account profile. The response uses Cache-Control no-store.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema:
                type: object
                required: [user_id, user_email, display, avatar_url, roles, state]
                properties:
                  user_id: {type: string}
                  user_email: {type: string, format: email}
                  display: {type: string}
                  avatar_url: {type: string}
                  roles: {type: array, items: {type: string}}
                  state: {type: string, const: active}
        "400":
          description: The JSON is invalid or contains unknown fields.
          content:
            application/json:
              schema: {type: object, required: [error], properties: {error: {type: string, const: invalid_json}}}
        "401": {description: The session is missing or invalid.}
        "403": {description: The account is not active.}
        "404": {description: Account management is disabled or the tenant account is missing.}
        "415": {description: The request media type is unsupported.}
        "422":
          description: The display name is missing, empty, too long, or contains control characters.
          content:
            application/json:
              schema: {type: object, required: [error], properties: {error: {type: string, const: invalid_display_name}}}
        "500": {description: The profile update failed.}
    delete:
      operationId: eraseAccount
      description: >-
        Initiate account erasure with the tenant session cookie and a key saved before the request.
        Repeat the same tenant and key to recover the operation after session revocation.
        Unknown keys require an authenticated account. The server cannot rotate an existing key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status_key]
              properties:
                status_key: {type: string, pattern: "^[A-Za-z0-9_-]{43}$", description: Canonical base64url encoding of 32 random bytes without padding.}
      responses:
        "202":
          description: The durable operation. Completion requires all declared phases.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            Location: {schema: {type: string, const: /auth/account-erasure}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountErasureOperation"}
        "400": {description: Invalid JSON or unknown fields.}
        "401": {description: Unknown status key and no valid tenant session.}
        "403": {description: The account cannot initiate erasure.}
        "404": {description: Account management is disabled or the account is missing.}
        "409": {description: The error is status_key_conflict or configured_credential. No new operation is created.}
        "415": {description: Unsupported request media type.}
        "422": {description: The status key is not canonical base64url for 32 bytes.}
        "500": {description: Operation persistence failed.}
        "503": {description: The mounted stores do not support durable erasure.}
  /auth/account-erasure:
    get:
      operationId: readAccountErasure
      description: >-
        Read an existing operation in the selected tenant. Authorization is Bearer followed by
        the saved status key. This request cannot create an account or operation.
        Incomplete operations do not expire. Completed receipts expire after 30 days.
      parameters:
        - {name: Authorization, in: header, required: true, schema: {type: string}}
      responses:
        "200":
          description: The operation state. Provider revocation gaps remain blocked.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountErasureOperation"}
        "400": {description: Invalid status key.}
        "401": {description: Missing status capability.}
        "404": {description: Unknown key or expired receipt.}
        "500": {description: Status persistence read failed.}
        "503": {description: The mounted stores do not support durable erasure.}
  /api/management/tenants/{tenant_id}/integration:
    get:
      security: [{ConsoleSession: []}]
      parameters:
        - {name: tenant_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: No-store resource. Export keys occur only in the first successful export response.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Integration"}
        default: {$ref: "#/components/responses/ManagementFailure"}
  /api/management/tenants/{tenant_id}/reauthentications:
    post:
      security: [{ConsoleSession: []}]
      parameters:
        - {name: tenant_id, in: path, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/ConsoleOrigin"}
        - {$ref: "#/components/parameters/ConsoleCSRF"}
        - {$ref: "#/components/parameters/RevisionMatch"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReauthenticationInput"}
      responses:
        "201":
          description: No-store resource. Export keys occur only in the first successful export response.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Reauthentication"}
        default: {$ref: "#/components/responses/ManagementFailure"}
  /api/management/tenants/{tenant_id}/key-exports:
    post:
      security: [{ConsoleSession: []}]
      parameters:
        - {name: tenant_id, in: path, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/ConsoleOrigin"}
        - {$ref: "#/components/parameters/ConsoleCSRF"}
        - {$ref: "#/components/parameters/RevisionMatch"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KeyExportInput"}
      responses:
        "201":
          description: No-store resource. Export keys occur only in the first successful export response.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KeyExport"}
        default: {$ref: "#/components/responses/ManagementFailure"}
  /api/management/tenants/{tenant_id}/reauthentications/{resourceId}:
    get:
      security: [{ConsoleSession: []}]
      parameters:
        - {name: tenant_id, in: path, required: true, schema: {type: string}}
        - {name: resourceId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: No-store resource. Export keys occur only in the first successful export response.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Reauthentication"}
        default: {$ref: "#/components/responses/ManagementFailure"}
  /api/management/tenants/{tenant_id}/key-exports/{resourceId}:
    get:
      security: [{ConsoleSession: []}]
      parameters:
        - {name: tenant_id, in: path, required: true, schema: {type: string}}
        - {name: resourceId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: No-store resource. Export keys occur only in the first successful export response.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KeyExport"}
        default: {$ref: "#/components/responses/ManagementFailure"}
  /api/management/tenants/{tenant_id}/setup-checks:
    parameters:
      - {name: tenant_id, in: path, required: true, schema: {type: string}}
    get:
      security: [{ConsoleSession: []}]
      responses:
        "200":
          description: Cursor page of persisted setup evidence.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/SetupCheck"}}
                  next_cursor: {type: string}
        default: {$ref: "#/components/responses/ManagementFailure"}
    post:
      security: [{ConsoleSession: []}]
      parameters:
        - {$ref: "#/components/parameters/ConsoleOrigin"}
        - {$ref: "#/components/parameters/ConsoleCSRF"}
        - {$ref: "#/components/parameters/RevisionMatch"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision]
              properties:
                revision: {type: integer, minimum: 1}
      responses:
        "201":
          description: Recorded result for fixed HTTPS probes of the verified active API destination. Responses use no-store.
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SetupCheck"}
        default: {$ref: "#/components/responses/ManagementFailure"}
  /api/management/tenants/{tenant_id}/setup-checks/{resourceId}:
    get:
      security: [{ConsoleSession: []}]
      parameters:
        - {name: tenant_id, in: path, required: true, schema: {type: string}}
        - {name: resourceId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Persisted setup result. Evidence contains no response bodies or secrets.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SetupCheck"}
        default: {$ref: "#/components/responses/ManagementFailure"}
  /.well-known/tauth-console:
    get:
      operationId: getConsoleBootstrap
      security: []
      responses:
        '200':
          description: Public console authentication settings. The response uses no-store.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [tenant_id, google_web_client_id, console_origin]
                properties:
                  tenant_id: {type: string, enum: [tauth-console]}
                  google_web_client_id: {type: string}
                  console_origin: {type: string, format: uri}
  /api/management/provisioning-credentials:
    get:
      operationId: listProvisioningCredentials
      security: [{ConsoleSession: []}]
      responses:
        '200':
          description: The owner's cursor page of credentials. Credential tokens are omitted.
          content:
            application/json:
              schema: {type: object, required: [items, next_cursor]}
        default: {$ref: '#/components/responses/ManagementFailure'}
    post:
      operationId: createProvisioningCredential
      security: [{ConsoleSession: []}]
      parameters:
        - {$ref: '#/components/parameters/ConsoleOrigin'}
        - {$ref: '#/components/parameters/ConsoleCSRF'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProvisioningCredentialInput'}
      responses:
        '201':
          description: The generated token occurs once. An identical retry returns metadata only.
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProvisioningCredential'}
        default: {$ref: '#/components/responses/ManagementFailure'}
  /api/management/provisioning-credentials/{credential_id}:
    parameters:
      - name: credential_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: readProvisioningCredential
      security: [{ConsoleSession: []}]
      responses:
        '200':
          description: The credential metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProvisioningCredential'}
        default: {$ref: '#/components/responses/ManagementFailure'}
    delete:
      operationId: revokeProvisioningCredential
      security: [{ConsoleSession: []}]
      responses:
        '204': {description: The credential is revoked.}
        default: {$ref: '#/components/responses/ManagementFailure'}
  /api/management/tenants/{tenant_id}/origin-proofs/{proof_id}:
    parameters:
      - {$ref: "#/components/parameters/ConsoleOrigin"}
      - name: tenant_id
        in: path
        required: true
        schema: {type: string}
      - name: proof_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: readOriginProof
      security: [{ConsoleSession: []}, {ProvisioningBearer: []}]
      responses:
        "200":
          description: The addressed resource.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            Location: {schema: {type: string}}
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OriginProof"}
        default:
          $ref: "#/components/responses/ManagementFailure"
  /api/management/tenants/{tenant_id}/origin-proofs/{proof_id}/verifications/{verification_id}:
    parameters:
      - {$ref: "#/components/parameters/ConsoleOrigin"}
      - name: tenant_id
        in: path
        required: true
        schema: {type: string}
      - name: proof_id
        in: path
        required: true
        schema: {type: string}
      - name: verification_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: readOriginVerification
      security: [{ConsoleSession: []}, {ProvisioningBearer: []}]
      responses:
        "200":
          description: The addressed resource.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            Location: {schema: {type: string}}
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OriginVerification"}
        default:
          $ref: "#/components/responses/ManagementFailure"
  /api/management/apps:
    parameters:
      - {$ref: "#/components/parameters/ConsoleOrigin"}
    get:
      operationId: listApps
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: cursor
          in: query
          schema: {type: string, maxLength: 128}
      security: [{ConsoleSession: []}]
      responses:
        "200":
          description: The resource or cursor page. Responses have Cache-Control no-store. Creation includes Location. Individual App reads include ETag.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            Location: {schema: {type: string}}
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AppPage"}
        default:
          $ref: "#/components/responses/ManagementFailure"
    post:
      operationId: createApp
      security: [{ConsoleSession: []}]
      parameters:
        - {$ref: "#/components/parameters/ConsoleCSRF"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AppCreate"}
      responses:
        "201":
          description: The resource or cursor page. Responses have Cache-Control no-store. Creation includes Location. Individual App reads include ETag.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            Location: {schema: {type: string}}
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/App"}
        default:
          $ref: "#/components/responses/ManagementFailure"
  /api/management/apps/{app_id}:
    parameters:
      - {$ref: "#/components/parameters/ConsoleOrigin"}
      - name: app_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: readApp
      security: [{ConsoleSession: []}]
      responses:
        "200":
          description: The resource or cursor page. Responses have Cache-Control no-store. Creation includes Location. Individual App reads include ETag.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            Location: {schema: {type: string}}
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/App"}
        default:
          $ref: "#/components/responses/ManagementFailure"
    patch:
      operationId: updateApp
      security: [{ConsoleSession: []}]
      parameters:
        - {$ref: "#/components/parameters/ConsoleCSRF"}
        - {$ref: "#/components/parameters/RevisionMatch"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AppPatch"}
      responses:
        "200":
          description: The resource or cursor page. Responses have Cache-Control no-store. Creation includes Location. Individual App reads include ETag.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            Location: {schema: {type: string}}
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/App"}
        default:
          $ref: "#/components/responses/ManagementFailure"
  /api/management/tenants:
    parameters:
      - {$ref: "#/components/parameters/ConsoleOrigin"}
    get:
      operationId: listTenants
      parameters:
        - {name: app_id, in: query, schema: {type: string}}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: cursor
          in: query
          schema: {type: string, maxLength: 128}
      security: [{ConsoleSession: []}, {ProvisioningBearer: []}]
      responses:
        "200":
          description: The resource or cursor page. Responses have Cache-Control no-store. Creation includes Location. Tenant and configuration reads include ETag.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            Location: {schema: {type: string}}
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TenantPage"}
        default:
          $ref: "#/components/responses/ManagementFailure"
    post:
      operationId: createTenant
      security: [{ConsoleSession: []}, {ProvisioningBearer: []}]
      parameters:
        - {$ref: "#/components/parameters/ConsoleCSRF"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TenantCreate"}
      responses:
        "201":
          description: The resource or cursor page. Responses have Cache-Control no-store. Creation includes Location. Tenant and configuration reads include ETag.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            Location: {schema: {type: string}}
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Tenant"}
        default:
          $ref: "#/components/responses/ManagementFailure"
  /api/management/tenants/{tenant_id}:
    parameters:
      - {$ref: "#/components/parameters/ConsoleOrigin"}
      - name: tenant_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: readTenant
      security: [{ConsoleSession: []}, {ProvisioningBearer: []}]
      responses:
        "200":
          description: The resource or cursor page. Responses have Cache-Control no-store. Creation includes Location. Tenant and configuration reads include ETag.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            Location: {schema: {type: string}}
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Tenant"}
        default:
          $ref: "#/components/responses/ManagementFailure"
    patch:
      operationId: updateTenant
      security: [{ConsoleSession: []}, {ProvisioningBearer: []}]
      parameters:
        - {$ref: "#/components/parameters/ConsoleCSRF"}
        - {$ref: "#/components/parameters/RevisionMatch"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TenantPatch"}
      responses:
        "200":
          description: The resource or cursor page. Responses have Cache-Control no-store. Creation includes Location. Tenant and configuration reads include ETag.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            Location: {schema: {type: string}}
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Tenant"}
        default:
          $ref: "#/components/responses/ManagementFailure"
  /api/management/tenants/{tenant_id}/configuration:
    parameters:
      - {$ref: "#/components/parameters/ConsoleOrigin"}
      - name: tenant_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: readTenantConfiguration
      security: [{ConsoleSession: []}, {ProvisioningBearer: []}]
      responses:
        "200":
          description: The resource or cursor page. Responses have Cache-Control no-store. Creation includes Location. Tenant and configuration reads include ETag.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            Location: {schema: {type: string}}
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TenantConfiguration"}
        default:
          $ref: "#/components/responses/ManagementFailure"
    put:
      operationId: replaceTenantConfiguration
      description: Provisioning credentials require the exclusive provisioning shape. The console shape or a null provisioning value returns 422.
      security: [{ConsoleSession: []}, {ProvisioningBearer: []}]
      parameters:
        - {$ref: "#/components/parameters/ConsoleCSRF"}
        - {$ref: "#/components/parameters/RevisionMatch"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TenantConfigurationInput"}
      responses:
        "200":
          description: The resource or cursor page. Responses have Cache-Control no-store. Creation includes Location. Tenant and configuration reads include ETag.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            Location: {schema: {type: string}}
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TenantConfiguration"}
        default:
          $ref: "#/components/responses/ManagementFailure"
  /api/management/tenants/{tenant_id}/origin-proofs:
    parameters:
      - {$ref: "#/components/parameters/ConsoleOrigin"}
      - name: tenant_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: listOriginProofs
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: cursor
          in: query
          schema: {type: string, maxLength: 128}
      security: [{ConsoleSession: []}, {ProvisioningBearer: []}]
      responses:
        "200":
          description: The resource or cursor page. Responses have Cache-Control no-store. Creation includes Location. Tenant and configuration reads include ETag.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            Location: {schema: {type: string}}
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OriginProofPage"}
        default:
          $ref: "#/components/responses/ManagementFailure"
    post:
      operationId: createOriginProof
      security: [{ConsoleSession: []}, {ProvisioningBearer: []}]
      parameters:
        - {$ref: "#/components/parameters/ConsoleCSRF"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OriginProofInput"}
      responses:
        "201":
          description: The resource or cursor page. Responses have Cache-Control no-store. Creation includes Location. Tenant and configuration reads include ETag.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            Location: {schema: {type: string}}
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OriginProof"}
        default:
          $ref: "#/components/responses/ManagementFailure"
  /api/management/tenants/{tenant_id}/origin-proofs/{proof_id}/verifications:
    parameters:
      - {$ref: "#/components/parameters/ConsoleOrigin"}
      - name: tenant_id
        in: path
        required: true
        schema: {type: string}
      - name: proof_id
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: createOriginVerification
      security: [{ConsoleSession: []}, {ProvisioningBearer: []}]
      parameters:
        - {$ref: "#/components/parameters/ConsoleCSRF"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EmptyInput"}
      responses:
        "201":
          description: The resource or cursor page. Responses have Cache-Control no-store. Creation includes Location. Tenant and configuration reads include ETag.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            Location: {schema: {type: string}}
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OriginVerification"}
        default:
          $ref: "#/components/responses/ManagementFailure"
  /api/management/tenants/{tenant_id}/activations:
    parameters:
      - {$ref: "#/components/parameters/ConsoleOrigin"}
      - name: tenant_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: listActivations
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: cursor
          in: query
          schema: {type: string, maxLength: 128}
      security: [{ConsoleSession: []}, {ProvisioningBearer: []}]
      responses:
        "200":
          description: The resource or cursor page. Responses have Cache-Control no-store. Creation includes Location. Tenant and configuration reads include ETag.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            Location: {schema: {type: string}}
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ActivationPage"}
        default:
          $ref: "#/components/responses/ManagementFailure"
    post:
      operationId: createActivation
      description: A suspended tenant requires owner recovery. Provisioning activation returns 409 while the tenant is suspended.
      security: [{ConsoleSession: []}, {ProvisioningBearer: []}]
      parameters:
        - {$ref: "#/components/parameters/ConsoleCSRF"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
        - {$ref: "#/components/parameters/RevisionMatch"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ActivationInput"}
      responses:
        "201":
          description: The resource or cursor page. Responses have Cache-Control no-store. Creation includes Location. Tenant and configuration reads include ETag.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            Location: {schema: {type: string}}
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Activation"}
        default:
          $ref: "#/components/responses/ManagementFailure"
  /api/management/tenants/{tenant_id}/activations/{activation_id}:
    parameters:
      - {$ref: "#/components/parameters/ConsoleOrigin"}
      - name: tenant_id
        in: path
        required: true
        schema: {type: string}
      - name: activation_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: readActivation
      security: [{ConsoleSession: []}, {ProvisioningBearer: []}]
      responses:
        "200":
          description: The resource or cursor page. Responses have Cache-Control no-store. Creation includes Location. Tenant and configuration reads include ETag.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            Location: {schema: {type: string}}
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Activation"}
        default:
          $ref: "#/components/responses/ManagementFailure"
  /api/management/tenants/{tenant_id}/audit-events:
    parameters:
      - {$ref: "#/components/parameters/ConsoleOrigin"}
      - name: tenant_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: listTenantAuditEvents
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: cursor
          in: query
          schema: {type: string, maxLength: 128}
      security: [{ConsoleSession: []}, {ProvisioningBearer: []}]
      responses:
        "200":
          description: The resource or cursor page. Responses have Cache-Control no-store. Creation includes Location. Tenant and configuration reads include ETag.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            Location: {schema: {type: string}}
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuditEventPage"}
        default:
          $ref: "#/components/responses/ManagementFailure"
  /api/management/accounts:
    get:
      operationId: listOwnerAccounts
      summary: List owner accounts for a configured administrator.
      description: The administrator role does not grant access to another owner workspace.
      security: [{ConsoleSession: []}]
      parameters:
        - name: Origin
          in: header
          required: true
          schema: {type: string, format: uri}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: cursor
          in: query
          schema: {type: string, maxLength: 128}
      responses:
        "200":
          description: Account directory page. Responses have Cache-Control no-store.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/OwnerAccount"}
                  next_cursor: {type: string}
        default:
          $ref: "#/components/responses/ManagementFailure"
  /api/management/owner-account:
    parameters:
      - name: Origin
        in: header
        required: true
        schema: {type: string, format: uri}
        description: The exact configured console origin.
    get:
      operationId: readOwnerAccount
      summary: Read the authenticated owner account.
      security: [{ConsoleSession: []}]
      responses:
        "200":
          $ref: "#/components/responses/OwnerAccount"
        "401":
          $ref: "#/components/responses/ManagementFailure"
        "403":
          $ref: "#/components/responses/ManagementFailure"
        "404":
          $ref: "#/components/responses/ManagementFailure"
        "500":
          $ref: "#/components/responses/ManagementFailure"
    put:
      operationId: provisionOwnerAccount
      summary: Create the owner account for the authenticated console subject.
      description: An existing subject binding returns the same owner account. Every verified console identity can enroll independently of other accounts.
      security: [{ConsoleSession: []}]
      parameters:
        - name: X-TAuth-CSRF
          in: header
          required: true
          schema: {type: string, const: "1"}
      responses:
        "200":
          $ref: "#/components/responses/OwnerAccount"
        "201":
          description: The owner account was created.
          headers:
            Location:
              schema: {type: string, const: /api/management/owner-account}
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OwnerAccount"}
        "401":
          $ref: "#/components/responses/ManagementFailure"
        "403":
          $ref: "#/components/responses/ManagementFailure"
        "415":
          $ref: "#/components/responses/ManagementFailure"
        "500":
          $ref: "#/components/responses/ManagementFailure"
  /auth/github/start:
    get:
      operationId: startGitHubLogin
      summary: Start GitHub identity authentication.
      description: Create a five-minute browser-bound transaction and redirect to GitHub with PKCE S256.
      parameters:
        - name: tenant_id
          in: query
          schema: {type: string}
          description: Select the specified tenant, or resolve one tenant from the return destination.
        - name: return_to
          in: query
          schema: {type: string, format: uri}
          description: Use one configured tenant origin. Required for session login and linking.
        - name: operation
          in: query
          schema: {type: string, enum: [session, link, oauth], default: session}
        - name: oauth_request
          in: query
          schema: {type: string}
          description: Identify the pending OAuth request. Required only for OAuth continuation.
        - name: popup
          in: query
          schema: {type: boolean, const: true}
          description: Select popup completion for session login or linking.
        - name: correlation
          in: query
          schema: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
          description: Supply a random 32-byte base64url value for popup completion.
      responses:
        "302":
          description: The browser receives a secure transaction cookie and the GitHub authorization destination.
          headers:
            Location:
              schema: {type: string, format: uri}
            Cache-Control:
              schema: {type: string, const: no-store}
        "400":
          $ref: "#/components/responses/GitHubFailure"
        "401":
          $ref: "#/components/responses/GitHubFailure"
        "404":
          $ref: "#/components/responses/GitHubFailure"
        "500":
          $ref: "#/components/responses/GitHubFailure"
        "503":
          $ref: "#/components/responses/GitHubFailure"
  /auth/github/callback:
    get:
      operationId: completeGitHubLogin
      summary: Complete a GitHub login transaction.
      description: Claim the browser-bound transaction before exchange. Resolve the tenant without an Origin header.
      parameters:
        - name: iss
          in: query
          required: true
          schema: {type: string, const: "https://github.com/login/oauth"}
          description: The exact GitHub issuer. Validate this value before the token exchange.
        - name: state
          in: query
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
        - name: code
          in: query
          schema: {type: string}
        - name: error
          in: query
          schema: {type: string}
        - name: error_description
          in: query
          schema: {type: string}
        - name: error_uri
          in: query
          schema: {type: string}
        - name: tenant_id
          in: query
          schema: {type: string}
          description: If present, this value must match the transaction tenant.
      responses:
        "200":
          description: >-
            A popup page sends completion status and correlation to the initiating origin.
            OAuth continuation returns a TAuth document that starts navigation to consent after the document loads.
          content:
            text/html:
              schema: {type: string}
        "303":
          description: Session login or account linking sets TAuth cookies and returns to the approved destination.
          headers:
            Location:
              schema: {type: string, format: uri}
        "400":
          $ref: "#/components/responses/GitHubFailure"
        "401":
          $ref: "#/components/responses/GitHubFailure"
        "403":
          $ref: "#/components/responses/GitHubFailure"
        "409":
          $ref: "#/components/responses/GitHubFailure"
        "500":
          $ref: "#/components/responses/GitHubFailure"
        "502":
          $ref: "#/components/responses/GitHubFailure"
  /.well-known/oauth-authorization-server:
    get:
      operationId: getAuthorizationServerMetadata
      summary: Get authorization-server metadata.
      responses:
        "200":
          description: The RFC 8414 metadata for the configured issuer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationServerMetadata"
  /oauth/github-credentials:
    post:
      operationId: getGitHubResourceCredential
      summary: Get the user's GitHub credential for an authenticated resource service.
      parameters:
        - name: Authorization
          in: header
          required: true
          description: Bearer resource service key. Public clients must not receive this key.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subject_token]
              properties:
                subject_token:
                  type: string
                  description: The user's current resource access token.
      responses:
        "200":
          description: The current GitHub credential. The response prohibits caching.
          content:
            application/json:
              schema:
                type: object
                required: [github_id, access_token, token_type, scope]
                properties:
                  github_id:
                    type: string
                  access_token:
                    type: string
                  token_type:
                    type: string
                  scope:
                    type: string
        "400":
          $ref: "#/components/responses/OAuthError"
        "401":
          $ref: "#/components/responses/OAuthError"
        "403":
          $ref: "#/components/responses/OAuthError"
        "500":
          $ref: "#/components/responses/OAuthError"
  /oauth/jwks:
    get:
      operationId: getOAuthJWKS
      summary: Get public OAuth verification keys.
      responses:
        "200":
          description: The public ES256 verification keys for current and retained key IDs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JWKSet"
  /oauth/authorize:
    get:
      operationId: authorizeOAuthClient
      summary: Start a browser authorization-code transaction.
      parameters:
        - $ref: "#/components/parameters/ResponseType"
        - $ref: "#/components/parameters/ClientID"
        - $ref: "#/components/parameters/RedirectURI"
        - $ref: "#/components/parameters/Resource"
        - $ref: "#/components/parameters/Scope"
        - $ref: "#/components/parameters/State"
        - $ref: "#/components/parameters/CodeChallenge"
        - $ref: "#/components/parameters/CodeChallengeMethod"
      responses:
        "303":
          description: Continue at a TAuth login or consent page, or return a code or OAuth error to the exact client redirect URI.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/OAuthError"
  /oauth/login:
    get:
      operationId: getOAuthLogin
      summary: Show the issuer-owned login page for a pending request.
      parameters:
        - $ref: "#/components/parameters/RequestHandle"
      responses:
        "200":
          description: The no-store TAuth login page.
          content:
            text/html:
              schema:
                type: string
        "303":
          description: Continue to consent when the user has a valid session.
        "400":
          $ref: "#/components/responses/OAuthError"
    post:
      operationId: submitOAuthLogin
      summary: Authenticate a user for a pending request.
      parameters:
        - $ref: "#/components/parameters/BrowserOrigin"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: "#/components/schemas/OAuthPasswordLogin"
                - $ref: "#/components/schemas/OAuthGoogleLogin"
      responses:
        "200":
          description: >-
            A Google login POST with Accept application/json returns the next consent URL.
            This response also applies when the request has a valid TAuth session.
            The response uses Cache-Control no-store.
          content:
            application/json:
              schema:
                type: object
                required: [next]
                properties:
                  next:
                    type: string
                    format: uri
        "303":
          description: Continue to the issuer-owned consent page after password login.
        "401":
          description: The login was not accepted. The response contains no account data.
          content:
            text/html:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/OAuthError"
  /oauth/consent:
    get:
      operationId: getOAuthConsent
      summary: Show the client, resource, scopes, and return host.
      parameters:
        - $ref: "#/components/parameters/RequestHandle"
      responses:
        "200":
          description: The no-store TAuth consent page.
          content:
            text/html:
              schema:
                type: string
        "303":
          description: Continue to login without a valid tenant session, or return a code when the exact consent grant is valid.
        "400":
          $ref: "#/components/responses/OAuthError"
    post:
      operationId: decideOAuthConsent
      summary: Approve or deny a pending client grant.
      parameters:
        - $ref: "#/components/parameters/BrowserOrigin"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [request, decision]
              properties:
                request:
                  type: string
                decision:
                  type: string
                  enum: [approve, deny]
      responses:
        "303":
          description: Return a one-time code or access_denied to the exact registered redirect URI.
        "400":
          $ref: "#/components/responses/OAuthError"
  /oauth/token:
    post:
      operationId: exchangeOAuthGrant
      summary: Exchange a code or rotate a refresh token.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: "#/components/schemas/AuthorizationCodeExchange"
                - $ref: "#/components/schemas/RefreshTokenExchange"
      responses:
        "200":
          description: A short-lived resource access token and one opaque rotating refresh token.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/OAuthError"
  /oauth/revoke:
    post:
      operationId: revokeOAuthGrant
      summary: Revoke a refresh-token family and its consent grant.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token, client_id]
              properties:
                token:
                  type: string
                token_type_hint:
                  type: string
                  description: Optional lookup hint. TAuth ignores unrecognized values as required by RFC 7009.
                client_id:
                  type: string
      responses:
        "200":
          description: Revocation is complete. Unknown tokens have the same response.
        "400":
          $ref: "#/components/responses/OAuthError"
components:
  parameters:
    ConsoleOrigin:
      name: Origin
      in: header
      required: false
      description: Required for console cookies. Prohibited for provisioning credentials.
      schema: {type: string, format: uri}
    ConsoleCSRF:
      name: X-TAuth-CSRF
      in: header
      required: false
      description: Required for console cookie mutations.
      schema: {type: string, const: '1'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    RevisionMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string}
    ResponseType:
      name: response_type
      in: query
      required: true
      schema:
        type: string
        const: code
    ClientID:
      name: client_id
      in: query
      required: true
      schema:
        type: string
    RedirectURI:
      name: redirect_uri
      in: query
      required: true
      description: >-
        Use a declared callback URI. Native clients from Client ID Metadata
        Documents can select any port from 1 through 65535 for HTTP loopback IP
        callbacks. All URI text except the port must stay the same.
        IPv4 and IPv6 callbacks each need their own declaration. The port rule does not apply
        to localhost, HTTPS callbacks, or web clients. Explicitly registered
        clients keep their configured port limits. The pending request and
        authorization code keep the selected callback port.
      schema:
        type: string
        format: uri
    Resource:
      name: resource
      in: query
      required: true
      schema:
        type: string
        format: uri
    Scope:
      name: scope
      in: query
      required: true
      schema:
        type: string
    State:
      name: state
      in: query
      required: true
      schema:
        type: string
    CodeChallenge:
      name: code_challenge
      in: query
      required: true
      schema:
        type: string
        minLength: 43
        maxLength: 43
    CodeChallengeMethod:
      name: code_challenge_method
      in: query
      required: true
      schema:
        type: string
        const: S256
    RequestHandle:
      name: request
      in: query
      required: true
      schema:
        type: string
    BrowserOrigin:
      name: Origin
      in: header
      required: true
      description: The exact issuer origin. Browsers set this header for the issuer-owned form POST.
      schema:
        type: string
        format: uri
  securitySchemes:
    ProvisioningBearer:
      type: http
      scheme: bearer
      description: An opaque revocable owner credential with explicit operation and tenant grants. Browser Origin and cookies are prohibited.
    ConsoleSession:
      type: apiKey
      in: cookie
      name: tauth_console_session
  responses:
    OwnerAccount:
      description: The current owner account.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/OwnerAccount"}
    ManagementFailure:
      description: The management request failed.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ManagementError"}
    GitHubFailure:
      description: A stable GitHub login error without provider credentials or response bodies.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GitHubError"
    OAuthError:
      description: A standard OAuth error without account, token, code, or key data.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthError"
  schemas:
    AccountErasureOperation:
      type: object
      additionalProperties: false
      required: [operation_id, state, reason, created_at, updated_at, expires_at, account_state, provider_revocations]
      properties:
        operation_id: {type: string}
        account_state: {type: string, enum: [retained, removed]}
        provider_revocations:
          type: array
          uniqueItems: true
          items:
            type: object
            additionalProperties: false
            required: [provider, state]
            properties:
              provider: {type: string, enum: [apple, github]}
              state: {type: string, enum: [pending, manual_action_required, revoked]}
        state: {type: string, enum: [pending, running, blocked, completed]}
        reason: {type: string, enum: ["", provider_revocation_unavailable, provider_revocation_failed, oauth_purge_failed, refresh_purge_failed, user_purge_failed, apple_revocation_manual_action_required]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        expires_at: {type: [string, "null"], format: date-time}
    SetupCheck:
      type: object
      additionalProperties: false
      required: [id, tenant_id, revision, state, created_at, evidence]
      properties:
        id: {type: string}
        tenant_id: {type: string}
        revision: {type: integer, minimum: 1}
        state: {type: string, enum: [succeeded, failed]}
        created_at: {type: string, format: date-time}
        evidence:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [path, status, code]
            properties:
              path: {type: string}
              status: {type: integer, minimum: 0, maximum: 599}
              code: {type: string}

    Integration:
      type: object
      required: [tenant_id, revision, api_base_url, frontend_origins, google_web_client_id, script_url, session_cookie_name, session_ttl, browser_html, backend_configuration, auth_routes]
      properties:
        tenant_id: {type: string}
        revision: {type: integer, minimum: 1}
        api_base_url: {type: string}
        frontend_origins: {type: array, items: {type: string}}
        google_web_client_id: {type: string}
        script_url: {type: string}
        session_cookie_name: {type: string}
        session_ttl: {type: string}
        browser_html: {type: string}
        backend_configuration: {type: object, additionalProperties: {type: string}}
        auth_routes: {type: array, items: {type: string}}
    ReauthenticationInput:
      type: object
      additionalProperties: false
      required: [revision, operation]
      properties:
        revision: {type: integer, minimum: 1}
        operation: {type: string, enum: [session-key-export]}
    Reauthentication:
      type: object
      required: [id, tenant_id, revision, operation, nonce, created_at, expires_at, consumed_at]
      properties:
        id: {type: string}
        tenant_id: {type: string}
        revision: {type: integer, minimum: 1}
        operation: {type: string, enum: [session-key-export]}
        nonce: {type: string}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        consumed_at: {type: [string, 'null']}
    KeyExportInput:
      type: object
      additionalProperties: false
      required: [reauthentication_id, google_id_token]
      properties:
        reauthentication_id: {type: string}
        google_id_token: {type: string}
    KeyExport:
      type: object
      required: [id, tenant_id, revision, reauthentication_id, created_at]
      properties:
        id: {type: string}
        tenant_id: {type: string}
        revision: {type: integer, minimum: 1}
        reauthentication_id: {type: string}
        created_at: {type: string, format: date-time}
        session_key_base64: {type: string, description: Present only in the initial export response.}
    TenantConfigurationInput:
      oneOf:
        - {$ref: '#/components/schemas/GoogleTenantConfigurationInput'}
        - {$ref: '#/components/schemas/ProvisioningConfigurationInput'}
    ProvisioningConfigurationInput:
      type: object
      additionalProperties: false
      required: [provisioning]
      properties:
        provisioning:
          type: object
          additionalProperties: false
          required: [generation, contribution]
          properties:
            generation: {type: integer, minimum: 1}
            contribution: {$ref: '#/components/schemas/ProvisioningContribution'}
    ProvisioningContribution:
      type: object
      additionalProperties: false
      required: [owner, id, kind, desired, outputs]
      description: A resolved Gateway tenant contribution. The service validates desired fields through its deployment resource contract.
      properties:
        owner: {type: string, minLength: 1, maxLength: 128}
        id: {type: string, minLength: 1, maxLength: 128}
        kind: {type: string, enum: [tauth_tenant, tauth_github_tenant]}
        desired: {type: object}
        outputs:
          type: object
          additionalProperties:
            type: object
            required: [value]
            properties:
              value: {type: string}
              digest: {type: string}
              visibility: {type: string}
    ProvisioningBinding:
      type: object
      required: [tenant_id, contribution_owner, contribution_id, generation, revision]
      properties:
        tenant_id: {type: string}
        contribution_owner: {type: string}
        contribution_id: {type: string}
        generation: {type: integer}
        revision: {type: integer}
    ProvisioningCredentialInput:
      type: object
      additionalProperties: false
      required: [app_id, name, operations, tenant_ids, allow_create]
      properties:
        app_id: {type: string, minLength: 1}
        name: {type: string, minLength: 1, maxLength: 120}
        operations: {type: array, uniqueItems: true, items: {type: string, enum: [read, configure, activate, suspend, proofs]}}
        tenant_ids: {type: array, uniqueItems: true, maxItems: 100, items: {type: string}}
        allow_create: {type: boolean}
    ProvisioningCredential:
      type: object
      required: [app_id, id, name, operations, tenant_ids, allow_create, created_at, revoked_at]
      properties:
        app_id: {type: string, minLength: 1}
        id: {type: string}
        name: {type: string}
        operations: {type: array, items: {type: string}}
        tenant_ids: {type: array, items: {type: string}}
        allow_create: {type: boolean}
        created_at: {type: string, format: date-time}
        revoked_at: {type: [string, "null"], format: date-time}
        token: {type: string, description: Present only in the first creation response.}
    AuditEventPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/AuditEvent"}}
        next_cursor: {type: string}
    ActivationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Activation"}}
        next_cursor: {type: string}
    OriginProofPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/OriginProof"}}
        next_cursor: {type: string}
    AppPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/App"}}
        next_cursor: {type: string}
    App:
      type: object
      additionalProperties: false
      required: [id, name, version]
      properties:
        id: {type: string}
        name: {type: string}
        version: {type: integer, minimum: 1}
    AppCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
    AppPatch:
      $ref: "#/components/schemas/AppCreate"
    TenantPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Tenant"}}
        next_cursor: {type: string}
    Tenant:
      type: object
      additionalProperties: false
      required: [app_id, id, name, environment, version, state, active_revision]
      properties:
        app_id: {type: string, minLength: 1}
        id: {type: string}
        name: {type: string}
        environment: {type: string}
        version: {type: integer, minimum: 1}
        state: {type: string, enum: [draft, active, suspended]}
        active_revision: {type: [integer, "null"]}
    TenantConfiguration:
      type: object
      required: [revision, google_web_client_id, frontend_origins, api_base_url, local_development, session_ttl, refresh_ttl, session_cookie_name, refresh_cookie_name, providers]
      properties:
        provisioning: {$ref: '#/components/schemas/ProvisioningBinding'}
        revision: {type: integer, minimum: 1}
        google_web_client_id: {type: string}
        frontend_origins: {type: array, items: {type: string}}
        api_base_url: {type: string}
        local_development: {type: boolean}
        session_ttl: {type: string}
        refresh_ttl: {type: string}
        session_cookie_name: {type: string}
        refresh_cookie_name: {type: string}
        providers: {type: array, items: {type: string, enum: [google, apple, github, password]}}
    OriginProof:
      type: object
      required: [id, tenant_id, revision, hostname, name, value, state, expires_at, verified_at]
      properties:
        id: {type: string}
        tenant_id: {type: string}
        revision: {type: integer}
        hostname: {type: string}
        name: {type: string}
        value: {type: string}
        state: {type: string, enum: [pending, verified]}
        expires_at: {type: string, format: date-time}
        verified_at: {type: [string, "null"], format: date-time}
    OriginVerification:
      type: object
      required: [id, tenant_id, proof_id, state, created_at]
      properties:
        id: {type: string}
        tenant_id: {type: string}
        proof_id: {type: string}
        state: {type: string, const: verified}
        created_at: {type: string, format: date-time}
    Activation:
      type: object
      required: [id, tenant_id, revision, state, error_code, created_at]
      properties:
        id: {type: string}
        tenant_id: {type: string}
        revision: {type: integer}
        state: {type: string, enum: [succeeded, failed]}
        error_code: {type: string}
        created_at: {type: string, format: date-time}
    AuditEvent:
      type: object
      required: [id, tenant_id, actor_account_id, operation, revision, result, created_at]
      properties:
        id: {type: string}
        tenant_id: {type: string}
        actor_account_id: {type: string}
        operation: {type: string}
        revision: {type: integer}
        result: {type: string}
        created_at: {type: string, format: date-time}
    EmptyInput:
      type: object
      additionalProperties: false
    TenantCreate:
      oneOf:
        - $ref: "#/components/schemas/OwnerTenantCreate"
        - $ref: "#/components/schemas/ProvisioningTenantCreate"
    OwnerTenantCreate:
      type: object
      additionalProperties: false
      required: [app_id, name, application_origin, google_web_client_id]
      description: Creates and activates a Google tenant atomically. DNS verification is not required.
      properties:
        app_id: {type: string, minLength: 1}
        name: {type: string, minLength: 1, maxLength: 120}
        application_origin: {type: string, format: uri, description: Exact HTTPS application origin. Loopback origins can use HTTP and include a port.}
        google_web_client_id: {type: string, maxLength: 256, pattern: '^[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$'}
        environment: {type: string, maxLength: 40}
    ProvisioningTenantCreate:
      type: object
      additionalProperties: false
      required: [id, name]
      description: A provisioning credential creates a declared tenant for complete provider configuration through the deployment workflow.
      properties:
        id: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{1,63}$'}
        name: {type: string, minLength: 1, maxLength: 120}
        environment: {type: string, maxLength: 40}
    TenantPatch:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        environment: {type: string, maxLength: 40}
        state: {type: string, enum: [suspended]}
    GoogleTenantConfigurationInput:
      type: object
      additionalProperties: false
      required: [google_web_client_id, frontend_origins, api_base_url, local_development, session_ttl, refresh_ttl]
      properties:
        google_web_client_id: {type: string, maxLength: 256}
        frontend_origins: {type: array, maxItems: 20, uniqueItems: true, items: {type: string, format: uri}}
        api_base_url: {type: string, format: uri}
        local_development: {type: boolean}
        session_ttl: {type: string}
        refresh_ttl: {type: string}
    ActivationInput:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: {type: integer, minimum: 1}
    OriginProofInput:
      type: object
      additionalProperties: false
      required: [revision, hostname]
      properties:
        revision: {type: integer, minimum: 1}
        hostname: {type: string, maxLength: 253}
    OwnerAccount:
      type: object
      additionalProperties: false
      required: [id, display_name, contact_email, state, created_at, administrator]
      properties:
        administrator: {type: boolean}
        id: {type: string, pattern: '^[A-Za-z0-9_-]{22}$'}
        display_name: {type: string}
        contact_email: {type: string, format: email}
        state: {type: string, const: active}
        created_at: {type: string, format: date-time}
    ManagementError:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code: {type: string}
        message: {type: string}
        request_id: {type: string}
        details: {type: [object, "null"], additionalProperties: true}
    GitHubError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - missing_tenant
            - github_login_not_configured
            - https_required
            - invalid_origin
            - invalid_return_to
            - invalid_state
            - invalid_oauth_request
            - authentication_required
            - github_consent_denied
            - github_provider_rejected
            - github_verified_email_required
            - user_not_allowed
            - account_exists
            - account_disabled
            - store_failure
    ProviderIdentity:
      type: object
      additionalProperties: false
      required: [provider, provider_id]
      properties:
        provider:
          type: string
          const: github
        provider_id:
          type: string
          pattern: '^[1-9][0-9]{0,19}$'
          description: The positive decimal GitHub user ID, within the unsigned 64-bit range.
    ProviderIdentities:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        $ref: "#/components/schemas/ProviderIdentity"
      description: This signed claim is present only when a granted resource scope requires provider identity disclosure.
    AuthorizationServerMetadata:
      type: object
      required:
        - issuer
        - authorization_endpoint
        - token_endpoint
        - revocation_endpoint
        - jwks_uri
        - response_types_supported
        - grant_types_supported
        - code_challenge_methods_supported
        - resource_parameter_supported
        - authorization_response_iss_parameter_supported
      properties:
        issuer:
          type: string
          format: uri
        authorization_endpoint:
          type: string
          format: uri
        token_endpoint:
          type: string
          format: uri
        revocation_endpoint:
          type: string
          format: uri
        jwks_uri:
          type: string
          format: uri
        scopes_supported:
          type: array
          items:
            type: string
        response_types_supported:
          type: array
          items:
            type: string
        grant_types_supported:
          type: array
          items:
            type: string
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
        revocation_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
        code_challenge_methods_supported:
          type: array
          items:
            type: string
        client_id_metadata_document_supported:
          type: boolean
        resource_parameter_supported:
          type: boolean
          const: true
        authorization_response_iss_parameter_supported:
          type: boolean
          const: true
    JWKSet:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/JWK"
    JWK:
      type: object
      required: [kty, use, kid, alg, crv, x, y]
      properties:
        kty:
          type: string
          const: EC
        use:
          type: string
          const: sig
        kid:
          type: string
        alg:
          type: string
          const: ES256
        crv:
          type: string
          const: P-256
        x:
          type: string
        y:
          type: string
    AuthorizationCodeExchange:
      type: object
      required: [grant_type, code, client_id, resource, code_verifier]
      properties:
        grant_type:
          type: string
          const: authorization_code
        code:
          type: string
        client_id:
          type: string
        resource:
          type: string
          format: uri
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
    OAuthPasswordLogin:
      type: object
      required: [request, provider, email, password]
      properties:
        request:
          type: string
        provider:
          type: string
          const: password
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    OAuthGoogleLogin:
      type: object
      required: [request, provider, google_id_token, nonce_token]
      properties:
        request:
          type: string
        provider:
          type: string
          const: google
        google_id_token:
          type: string
        nonce_token:
          type: string
    RefreshTokenExchange:
      type: object
      required: [grant_type, refresh_token, client_id, resource]
      properties:
        grant_type:
          type: string
          const: refresh_token
        refresh_token:
          type: string
        client_id:
          type: string
        resource:
          type: string
          format: uri
        scope:
          type: string
          description: Optional exact scope set from the approved refresh-token family.
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, scope, refresh_token]
      properties:
        access_token:
          type: string
          description: A signed TAuth JWT. Its optional provider_identities claim follows the ProviderIdentities schema.
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          minimum: 1
        scope:
          type: string
        refresh_token:
          type: string
    OAuthError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum:
            - access_denied
            - invalid_client
            - invalid_grant
            - invalid_request
            - invalid_scope
            - invalid_target
            - server_error
            - unsupported_grant_type
            - unsupported_response_type
            - unauthorized_client
