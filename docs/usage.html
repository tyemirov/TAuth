<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZDJN6BBQ8Y"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-ZDJN6BBQ8Y');

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="TAuth usage guide rendered from docs/usage.md for GitHub Pages."
    />
    <title>TAuth | Usage guide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink-100: #f3f8ff;
        --ink-70: #c1ccda;
        --ink-40: #8292a6;
        --background: #07090d;
        --surface: #0f141c;
        --surface-strong: #151d28;
        --accent: #5ef6ff;
        --accent-alt: #b6ff6a;
        --accent-warm: #ff985f;
        --grid-line: rgba(255, 255, 255, 0.08);
        --shadow: 0 22px 60px rgba(4, 8, 12, 0.55);
        --font-heading: "Space Mono", ui-monospace, SFMono-Regular, Menlo,
          Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        --font-body: "Sora", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: var(--font-body);
        color: var(--ink-100);
        background: radial-gradient(
            circle at 12% 18%,
            rgba(94, 246, 255, 0.14),
            transparent 45%
          ),
          radial-gradient(
            circle at 90% 10%,
            rgba(255, 152, 95, 0.12),
            transparent 45%
          ),
          radial-gradient(
            circle at 80% 85%,
            rgba(182, 255, 106, 0.12),
            transparent 50%
          ),
          var(--background);
        min-height: 100vh;
        line-height: 1.6;
        overflow-x: hidden;
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: -1;
      }

      body::before {
        background-image: linear-gradient(
            rgba(255, 255, 255, 0.03) 1px,
            transparent 1px
          ),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 120px 120px;
        opacity: 0.35;
      }

      body::after {
        background: radial-gradient(
          circle at 70% 20%,
          rgba(94, 246, 255, 0.12),
          transparent 60%
        );
        opacity: 0.7;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .skip-link {
        position: absolute;
        left: -999px;
        top: 0;
        background: var(--accent);
        color: #07090d;
        padding: 8px 14px;
        border-radius: 999px;
        z-index: 20;
      }

      .skip-link:focus {
        left: 20px;
        top: 20px;
      }

      .page {
        position: relative;
        padding: 28px 6vw 96px;
        max-width: 1100px;
        margin: 0 auto;
      }

      .site-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 16px 0 22px;
      }

      .logo {
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 20px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .nav {
        display: flex;
        gap: 18px;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--ink-40);
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .nav a {
        padding-bottom: 4px;
        border-bottom: 1px solid transparent;
      }

      .nav a:hover {
        border-color: var(--accent);
        color: var(--ink-100);
      }

      .cta {
        padding: 10px 16px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 13px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        white-space: nowrap;
      }

      .cta-primary {
        background: var(--accent);
        color: #05070a;
        box-shadow: 0 14px 30px rgba(94, 246, 255, 0.3);
      }

      .cta:hover {
        transform: translateY(-2px);
      }

      .panel {
        background: linear-gradient(
          135deg,
          rgba(15, 20, 28, 0.95),
          rgba(7, 9, 13, 0.85)
        );
        border: 1px solid var(--grid-line);
        border-radius: 22px;
        box-shadow: var(--shadow);
        padding: clamp(18px, 4vw, 36px);
      }

      .status {
        color: var(--ink-40);
        font-size: 13px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-bottom: 18px;
      }

      .markdown {
        color: var(--ink-70);
      }

      .markdown h1,
      .markdown h2,
      .markdown h3,
      .markdown h4 {
        font-family: var(--font-heading);
        color: var(--ink-100);
        line-height: 1.2;
        margin: 1.8em 0 0.7em;
      }

      .markdown h1 {
        font-size: clamp(28px, 3.6vw, 40px);
        margin-top: 0;
      }

      .markdown h2 {
        font-size: clamp(22px, 2.6vw, 28px);
      }

      .markdown h3 {
        font-size: clamp(18px, 2.1vw, 22px);
      }

      .markdown p {
        margin: 0.9em 0;
      }

      .markdown a {
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 0.18em;
      }

      .markdown a:hover {
        color: var(--accent-alt);
      }

      .markdown hr {
        border: none;
        border-top: 1px solid var(--grid-line);
        margin: 2.2em 0;
      }

      .markdown code {
        font-family: var(--font-heading);
        font-size: 0.95em;
        background: rgba(21, 29, 40, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 0.12em 0.35em;
        border-radius: 10px;
        color: var(--ink-100);
      }

      .markdown pre {
        background: rgba(7, 9, 13, 0.7);
        border: 1px solid var(--grid-line);
        border-radius: 18px;
        padding: 18px 20px;
        overflow-x: auto;
        margin: 1.2em 0;
      }

      .markdown pre code {
        background: transparent;
        border: none;
        padding: 0;
        border-radius: 0;
        color: var(--ink-70);
        font-size: 13px;
        letter-spacing: 0.02em;
      }

      .markdown blockquote {
        margin: 1.2em 0;
        padding: 14px 18px;
        border-left: 3px solid var(--accent-warm);
        background: rgba(21, 29, 40, 0.55);
        border-radius: 14px;
        color: var(--ink-70);
      }

      .markdown table {
        width: 100%;
        border-collapse: collapse;
        margin: 1.2em 0;
        font-size: 14px;
      }

      .markdown th,
      .markdown td {
        padding: 10px 12px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        vertical-align: top;
      }

      .markdown th {
        text-align: left;
        color: var(--ink-100);
        background: rgba(21, 29, 40, 0.65);
        font-family: var(--font-heading);
        letter-spacing: 0.04em;
      }

      .markdown ul,
      .markdown ol {
        padding-left: 1.2em;
        margin: 0.9em 0;
      }

      .markdown li {
        margin: 0.45em 0;
      }

      .site-footer {
        padding: 52px 0 0;
        color: var(--ink-40);
        font-size: 13px;
      }

      .site-footer__inner {
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        align-items: center;
        justify-content: space-between;
        border-top: 1px solid var(--grid-line);
        padding-top: 22px;
      }

      .site-footer__links {
        display: flex;
        gap: 18px;
      }

      .site-footer__links a:hover {
        color: var(--ink-100);
      }

      @media (max-width: 720px) {
        .site-header {
          flex-direction: column;
          align-items: flex-start;
        }

        .nav {
          justify-content: flex-start;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .cta {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="page">
      <header class="site-header">
        <a class="logo" href="index.html">TAuth</a>
        <nav class="nav" aria-label="Primary">
          <a href="index.html#docs">Docs</a>
          <a href="https://github.com/tyemirov/TAuth">GitHub</a>
          <a href="https://github.com/tyemirov/TAuth/blob/master/docs/usage.md">Edit</a>
        </nav>
        <a class="cta cta-primary" href="index.html">Landing</a>
      </header>

      <main id="main" class="panel">
        <div class="status" data-status>Loading docs/usage.md ...</div>
        <article class="markdown" data-markdown></article>
      </main>

      <footer class="site-footer">
        <div class="site-footer__inner">
          <div class="site-footer__brand">TAuth by Marco Polo Research Lab</div>
          <div class="site-footer__links">
            <a href="index.html">Landing</a>
            <a href="https://github.com/tyemirov/TAuth/blob/master/docs/usage.md">Markdown</a>
            <a href="https://github.com/tyemirov/TAuth/discussions">Community</a>
          </div>
        </div>
      </footer>
    </div>

    <script type="module">
      "use strict";

      import { marked } from "https://cdn.jsdelivr.net/npm/marked@12.0.2/lib/marked.esm.js";
      import DOMPurify from "https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.es.mjs";

      const MARKDOWN_SOURCE = "usage.md";
      const statusElement = document.querySelector("[data-status]");
      const markdownElement = document.querySelector("[data-markdown]");

      async function loadAndRenderMarkdown() {
        statusElement.textContent = "Loading docs/usage.md ...";
        markdownElement.textContent = "";

        let markdownText = "";
        try {
          const response = await fetch(MARKDOWN_SOURCE, { cache: "no-store" });
          if (!response.ok) {
            throw new Error(
              `Failed to load ${MARKDOWN_SOURCE}: ${response.status} ${response.statusText}`
            );
          }
          markdownText = await response.text();
        } catch (error) {
          statusElement.textContent =
            "Failed to load docs/usage.md. Make sure this page is served over HTTP(S).";
          return;
        }

        const rawHtml = marked.parse(markdownText, {
          gfm: true,
          breaks: false,
          headerIds: true,
          mangle: false,
        });
        markdownElement.innerHTML = DOMPurify.sanitize(rawHtml, {
          USE_PROFILES: { html: true },
        });
        statusElement.textContent = "";
      }

      loadAndRenderMarkdown();
    </script>
  </body>
</html>
