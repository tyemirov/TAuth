name: Go Tests

on:
  push:
    branches:
      - master
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "package.json"
      - "package-lock.json"
      - "tests/auth-refresh.browser.cjs"
      - "web/tauth.js"
      - ".github/workflows/go-tests.yml"
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "package.json"
      - "package-lock.json"
      - "tests/auth-refresh.browser.cjs"
      - "web/tauth.js"
      - ".github/workflows/go-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install browser test dependencies
        run: npm ci

      - name: Verify formatting
        run: |
          go fmt ./...
          git status --short
          git diff --exit-code

      - name: Run go vet
        run: go vet ./...

      - name: Run Tests
        run: go test ./...
