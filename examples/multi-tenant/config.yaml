server:
  listen_addr: ${TAUTH_LISTEN_ADDR}
  database_url: ${TAUTH_DATABASE_URL}
  enable_cors: ${TAUTH_ENABLE_CORS}
  cors_allowed_origins:
    - ${TAUTH_CORS_ORIGIN_1}
    - ${TAUTH_CORS_ORIGIN_2}
  cors_allowed_origin_exceptions:
    - ${TAUTH_CORS_EXCEPTION_1}
  enable_tenant_header_override: true

tenants:
  - id: ${TAUTH_TENANT_ID_GRAVITY}
    display_name: ${TAUTH_TENANT_DISPLAY_NAME_GRAVITY}
    tenant_origins:
      - ${TAUTH_TENANT_ORIGIN_GRAVITY}
    allowed_users:
      - "temirov@gmail.com"
      - "peter.tyemirov@gmail.com"
    google_web_client_id: ${TAUTH_TENANT_GOOGLE_WEB_CLIENT_GRAVITY}
    jwt_signing_key: ${TAUTH_TENANT_JWT_SIGNING_KEY_GRAVITY}
    cookie_domain: ${TAUTH_COOKIE_DOMAIN}
    session_cookie_name: ${TAUTH_TENANT_SESSION_COOKIE_NAME_GRAVITY}
    refresh_cookie_name: ${TAUTH_TENANT_REFRESH_COOKIE_NAME_GRAVITY}
    session_ttl: ${TAUTH_SESSION_TTL}
    refresh_ttl: ${TAUTH_REFRESH_TTL}
    nonce_ttl: ${TAUTH_NONCE_TTL}
    allow_insecure_http: ${TAUTH_ALLOW_INSECURE_HTTP}

  - id: ${TAUTH_TENANT_ID_MPR}
    display_name: ${TAUTH_TENANT_DISPLAY_NAME_MPR}
    tenant_origins:
      - ${TAUTH_TENANT_ORIGIN_MPR}
    allowed_users:
      - "temirov@gmail.com"
      - "peter.tyemirov@gmail.com"
    google_web_client_id: ${TAUTH_TENANT_GOOGLE_WEB_CLIENT_ID_MPR}
    jwt_signing_key: ${TAUTH_TENANT_JWT_SIGNING_KEY_MPR}
    cookie_domain: ${TAUTH_COOKIE_DOMAIN}
    session_cookie_name: ${TAUTH_TENANT_SESSION_COOKIE_NAME_MPR}
    refresh_cookie_name: ${TAUTH_TENANT_REFRESH_COOKIE_NAME_MPR}
    session_ttl: ${TAUTH_SESSION_TTL}
    refresh_ttl: ${TAUTH_REFRESH_TTL}
    nonce_ttl: ${TAUTH_NONCE_TTL}
    allow_insecure_http: ${TAUTH_ALLOW_INSECURE_HTTP}
