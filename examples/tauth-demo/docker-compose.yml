services:
  tauth:
    build:
      context: ../../
      dockerfile: Dockerfile
    image: tauth-local:latest
    env_file:
      - ./.env.tauth
    ports:
      - "8082:8082"
    volumes:
      - tauth_data:/data
      - ./config.yaml:/config/config.yaml:ro
    restart: unless-stopped

  mpr-frontend:
    image: ghcr.io/tyemirov/ghttp:latest
    pull_policy: always
    depends_on:
      tauth:
        condition: service_started
    command:
      [
        "--directory",
        "/app/demo",
        "--tls-cert",
        "/certs/computercat-cert.pem",
        "--tls-key",
        "/certs/computercat-key.pem",
        "8081",
      ]
    ports:
      - "8081:8081"
    volumes:
      - ./:/app/demo
      - /media/share/Drive/exchange/certs/computercat:/certs:ro
    restart: unless-stopped

volumes:
  tauth_data:
