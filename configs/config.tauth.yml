server:
  listen_addr: "${TAUTH_LISTEN_ADDR}"
  database_url: "${TAUTH_DATABASE_URL}"
  enable_cors: "${TAUTH_ENABLE_CORS}"
  cors_allowed_origins:
    - ${TAUTH_CORS_ORIGIN_1}
    - ${TAUTH_CORS_ORIGIN_2}
    - ${TAUTH_CORS_ORIGIN_3}
    - ${TAUTH_CORS_ORIGIN_4}
    - ${TAUTH_CORS_ORIGIN_5}
    - ${TAUTH_CORS_ORIGIN_6}
    - ${TAUTH_CORS_ORIGIN_7}
    - ${TAUTH_CORS_ORIGIN_8}
    - ${TAUTH_CORS_ORIGIN_9}
    - ${TAUTH_CORS_ORIGIN_10}
    - ${TAUTH_CORS_ORIGIN_11}
    - ${TAUTH_CORS_ORIGIN_12}
    - ${TAUTH_CORS_ORIGIN_13}
    - ${TAUTH_CORS_ORIGIN_14}
    - ${TAUTH_CORS_ORIGIN_15}
    - "${TAUTH_CORS_EXCEPTION_1}"
  cors_allowed_origin_exceptions:
    - "${TAUTH_CORS_EXCEPTION_1}"
  enable_tenant_header_override: ${TAUTH_ENABLE_TENANT_HEADER_OVERRIDE}

tenants:
  - id: "${TAUTH_TENANT_ID_PS}"
    display_name: "${TAUTH_DISPLAY_NAME_PS}"
    tenant_origins:
      - ${TAUTH_TENANT_ORIGIN_PS}
    google_web_client_id: "${TAUTH_GOOGLE_WEB_CLIENT_ID_PS}"
    jwt_signing_key: "${TAUTH_JWT_SIGNING_KEY_PS}"
    cookie_domain: "${TAUTH_COOKIE_DOMAIN_PS}"
    session_cookie_name: "${TAUTH_SESSION_COOKIE_NAME_PS}"
    refresh_cookie_name: "${TAUTH_REFRESH_COOKIE_NAME_PS}"
    session_ttl: "${TAUTH_SESSION_TTL}"
    refresh_ttl: "${TAUTH_REFRESH_TTL}"
    nonce_ttl: "${TAUTH_NONCE_TTL}"
    allow_insecure_http: "${TAUTH_ALLOW_INSECURE_HTTP}"
  - id: "${TAUTH_TENANT_ID_LOOPAWARE}"
    display_name: "${TAUTH_DISPLAY_NAME_LOOPAWARE}"
    tenant_origins:
      - ${TAUTH_TENANT_ORIGIN_LOOPAWARE}
    google_web_client_id: "${TAUTH_GOOGLE_WEB_CLIENT_ID_LOOPAWARE}"
    google_native_clients:
      - platform: "ios"
        client_id: "${TAUTH_GOOGLE_NATIVE_IOS_CLIENT_ID_LOOPAWARE}"
        redirect_uris:
