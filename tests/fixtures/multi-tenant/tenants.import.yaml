tenants:
  - id: "notes"
    display_name: "Notes"
    tenant_origins:
      - "http://localhost"
      - "http://localhost:8000"
    allowed_users:
      - "operator@example.com"
    google_web_client_id: ${TAUTH_GOOGLE_WEB_CLIENT_ID1}
    jwt_signing_key: ${TAUTH_NOTES_JWT_SIGNING_KEY}
    cookie_domain: ""
    session_cookie_name: "app_session"
    refresh_cookie_name: "app_refresh"
    session_ttl: "30m"
    refresh_ttl: "720h"
    nonce_ttl: "10m"
    allow_insecure_http: ${TAUTH_ALLOW_INSECURE_HTTP}

  - id: "portal"
    display_name: "Portal"
    tenant_origins:
      - "http://localhost"
      - "http://localhost:4173"
    allowed_users:
      - "operator@example.com"
    google_web_client_id: ${TAUTH_GOOGLE_WEB_CLIENT_ID2}
    jwt_signing_key: ${TAUTH_PORTAL_JWT_SIGNING_KEY}
    cookie_domain: ""
    session_cookie_name: "app_session_portal"
    refresh_cookie_name: "app_refresh_portal"
    session_ttl: "30m"
    refresh_ttl: "720h"
    nonce_ttl: "10m"
    allow_insecure_http: ${TAUTH_ALLOW_INSECURE_HTTP}
