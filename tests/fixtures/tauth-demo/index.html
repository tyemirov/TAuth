<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TAuth Demo Fixture</title>
    <link rel="stylesheet" href="./demo.css" />
    <script defer src="./demo-config.js"></script>
    <script defer src="./tauth-config.js"></script>
  </head>
  <body>
    <header id="demo-header" class="demo-header" data-tenant-id="demo">
      <a class="demo-brand" href="#">TAuth</a>
      <nav aria-label="Documentation"><a href="#docs">Docs</a></nav>
      <div data-demo-google-signin aria-label="Google Sign-In"></div>
      <button type="button" data-demo-sign-out>Sign out</button>
    </header>

    <main class="demo-shell">
      <section aria-labelledby="demo-title">
        <h1 id="demo-title">Fixture demo</h1>
        <p>Fixture content for demo tests.</p>
      </section>
      <section aria-labelledby="profile-status-title">
        <h2 id="profile-status-title">Current session</h2>
        <div data-demo-auth-status aria-live="polite" aria-atomic="true">
          <p>Awaiting connection to the TAuth service…</p>
        </div>
      </section>
    </main>

    <footer id="page-footer" class="demo-footer">
      <span>TAuth demonstration</span>
      <nav aria-label="Project links"><a href="#docs">Documentation</a></nav>
    </footer>
    <script defer src="./status-panel.js"></script>
  </body>
</html>
