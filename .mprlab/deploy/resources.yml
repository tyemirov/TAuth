---
mprlab_resources:
  schema_version: 1
  repo:
    id: tauth
    directory: TAuth
    dispatch_target: tauth
  resources:
    - type: make_workflow
      name: tauth
      targets:
        release: release
        publish: publish
        deploy: deploy
    - type: container_service
      name: tauth-api
      host_group: gateway
      image: ghcr.io/tyemirov/tauth:latest
      container_port: 8080
      compose_project: mprlab-gateway
    - type: caddy_route
      name: tauth-api
      hosts:
        - tauth-api.mprlab.com
        - tauth.mprlab.com
      upstream: tauth-api:8080
      snippet: tauth.caddy
    - type: health_check
      name: tauth
      path: /me
      url: https://tauth-api.mprlab.com/me
      status_codes:
        - 200
        - 401
        - 403
