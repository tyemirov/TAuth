---
mprlab_resources:
  owner: tauth
  release:
    scheme: semver
  defaults:
    timeouts:
      startup: 30s
      completion: 2m
      readiness: 2m
      request: 15s
      shutdown: 5s
  operations:
    ci:
      timeouts:
        completion: 350s
    app-plan-release: &plan-policy
      timeouts:
        completion: 2m
      polling: &provider-polling
        initial: 2s
        maximum: 10s
        increment: 1s
        multiplier: 2
        attempt_limit: 4
    app-plan-publish: *plan-policy
    app-plan-deploy: *plan-policy
    app-release:
      timeouts:
        completion: 30m
      polling: *provider-polling
    app-publish:
      timeouts:
        completion: 4h
      polling: *provider-polling
    app-deploy:
      timeouts:
        completion: 20m
      polling: *provider-polling
    deployment.http-health:
      polling:
        initial: 1s
        maximum: 1s
        increment: 0s
        multiplier: 1
        attempt_limit: 3
    deployment.resource.recovery:
      polling:
        initial: 1s
        maximum: 1s
        increment: 0s
        multiplier: 1
        attempt_limit: 3
    app_deploy.health.same_host:
      polling:
        initial: 15s
        maximum: 30s
        increment: 0s
        multiplier: 2
        attempt_limit: 3
    app_deploy.pages.deployment_status_poll:
      polling:
        initial: 1s
        maximum: 10s
        increment: 0s
        multiplier: 2
        attempt_limit: 120
  ci:
    enabled: true
    command:
      '0': make
      '1': ci
  resources:
    oauth-private:
      kind: private_values
      bindings:
        oauth-signing-key: TAUTH_OAUTH_ES256_PRIVATE_KEY_BASE64
        tenant-encryption-key: TAUTH_TENANT_ENCRYPTION_KEY
        trusted-proxy-cidrs: TAUTH_TRUSTED_PROXY_CIDRS
    runtime:
      kind: compose_project
      retired_services:
        mprlab-nginx-gateway/tauth-api: {}
      images:
        tauth-image:
          repository: ghcr.io/tyemirov/tauth
          build:
            context: .
            dockerfile: Dockerfile
            platforms:
            - linux/amd64
            - linux/arm64
      services:
        tauth-api:
          image: tauth-image
          placement:
            group: gateway
            cardinality: one
          command:
            '0': --config=/config/config.yml
          environment:
            TAUTH_TENANT_ENCRYPTION_KEY:
              resource: oauth-private
              output: tenant-encryption-key
            TAUTH_TRUSTED_PROXY_CIDRS:
              resource: oauth-private
              output: trusted-proxy-cidrs
          assets:
            /config/config.yml:
              managed: tauth.config
              mode: '0600'
          mounts:
            /data:
              volume: data
              read_only: false
          ports:
            '8080': {}
          readiness:
            protocol: http
            port: 8080
            path: /health
            expected_status: 200
      volumes:
        data:
          name: mprlab-nginx-gateway_tauth-data
          retention: retain
    http:
      kind: runtime_capability
      name: tauth.http
      version: 1
      project: runtime
      service: tauth-api
      endpoint:
        scope: same_host
        scheme: http
        alias: tauth-api
        port: 8080
      health:
        protocol: http
        path: /health
        expected_status: 200
    tenants:
      kind: runtime_capability
      name: tauth.tenants
      version: 1
      project: runtime
      service: tauth-api
      endpoint:
        scope: same_host
        scheme: http
        alias: tauth-tenants
        port: 8080
      health:
        protocol: http
        path: /health
        expected_status: 200
    oauth:
      kind: runtime_capability
      name: tauth.oauth
      version: 1
      project: runtime
      service: tauth-api
      endpoint:
        scope: same_host
        scheme: http
        alias: tauth-oauth
        port: 8080
      health:
        protocol: http
        path: /health
        expected_status: 200
    oauth-server:
      kind: tauth_authorization_server
      capability: tauth.oauth
      version: 1
      server:
        issuer: https://tauth-api.mprlab.com
        authorization_endpoint: https://tauth-api.mprlab.com/oauth/authorize
        token_endpoint: https://tauth-api.mprlab.com/oauth/token
        revocation_endpoint: https://tauth-api.mprlab.com/oauth/revoke
        jwks_uri: https://tauth-api.mprlab.com/oauth/jwks
        login_endpoint: https://tauth-api.mprlab.com/oauth/login
        consent_endpoint: https://tauth-api.mprlab.com/oauth/consent
        authorization_request_ttl: 5m
        authorization_code_ttl: 1m
        active_signing_key_id: oauth-2026-08
        signing_keys:
          oauth-2026-08:
            private_key:
              resource: oauth-private
              output: oauth-signing-key
        client_metadata:
          request_timeout: 3s
          maximum_bytes: 5120
          minimum_cache_ttl: 1m
          maximum_cache_ttl: 1h
    public-api:
      kind: caddy_route
      hostname: tauth-api.mprlab.com
      listener: https
      handlers:
        default:
          path_prefix: /
          upstream: tauth.http
          transport:
            protocol: http
            dial_timeout_seconds: 10
            response_header_timeout_seconds: 30
            read_timeout_seconds: 80
      tls:
        mode: automatic
      access:
        trusted_networks:
        - 127.0.0.1/32
        - 172.19.0.0/16
        - 192.168.1.158/32
        rate_limit:
          events: 300
          window_seconds: 10
    public-health:
      kind: health_check
      protocol: http
      url: https://tauth-api.mprlab.com/health
      expected_status: 200
    browser-helper:
      kind: github_pages
      repository: tyemirov/tauth
      branch: gh-pages
      domain: tauth.mprlab.com
      url: https://tauth.mprlab.com/
      source:
        kind: container
        context: .
        dockerfile: docker/pages/Dockerfile
        target: pages
      verification:
        path: /.mprlab-release.json
