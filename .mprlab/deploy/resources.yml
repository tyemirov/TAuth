---
mprlab_resources:
  schema_version: 4
  owner: tauth
  release:
    scheme: semver
  resources:
    - kind: private_values
      id: oauth-private
      bindings:
        oauth-signing-key: TAUTH_OAUTH_ES256_PRIVATE_KEY_BASE64
    - kind: compose_project
      id: runtime
      retired_services:
        - project: mprlab-nginx-gateway
          service: tauth-api
      images:
        - id: tauth-image
          repository: ghcr.io/tyemirov/tauth
          build:
            context: .
            dockerfile: Dockerfile
            platforms:
              - linux/amd64
              - linux/arm64
      services:
        - id: tauth-api
          image: tauth-image
          placement:
            group: gateway
            cardinality: one
          command:
            - --config=/config/config.yml
          assets:
            - managed: tauth.config
              target: /config/config.yml
              mode: "0600"
          mounts:
            - volume: data
              target: /data
              read_only: false
          ports:
            - container_port: 8080
          readiness:
            protocol: http
            port: 8080
            path: /health
            expected_status: 200
      volumes:
        - id: data
          name: mprlab-nginx-gateway_tauth-data
          retention: retain
    - kind: runtime_capability
      id: http
      name: tauth.http
      version: 1
      project: runtime
      service: tauth-api
      endpoint:
        scope: same_host
        scheme: http
        alias: tauth-api
        port: 8080
      health:
        protocol: http
        path: /health
        expected_status: 200
    - kind: runtime_capability
      id: tenants
      name: tauth.tenants
      version: 1
      project: runtime
      service: tauth-api
      endpoint:
        scope: same_host
        scheme: http
        alias: tauth-tenants
        port: 8080
      health:
        protocol: http
        path: /health
        expected_status: 200
    - kind: runtime_capability
      id: oauth
      name: tauth.oauth
      version: 1
      project: runtime
      service: tauth-api
      endpoint:
        scope: same_host
        scheme: http
        alias: tauth-oauth
        port: 8080
      health:
        protocol: http
        path: /health
        expected_status: 200
    - kind: tauth_authorization_server
      id: oauth-server
      capability: tauth.oauth
      version: 1
      server:
        issuer: https://tauth-api.mprlab.com
        authorization_endpoint: https://tauth-api.mprlab.com/oauth/authorize
        token_endpoint: https://tauth-api.mprlab.com/oauth/token
        revocation_endpoint: https://tauth-api.mprlab.com/oauth/revoke
        jwks_uri: https://tauth-api.mprlab.com/oauth/jwks
        login_endpoint: https://tauth-api.mprlab.com/oauth/login
        consent_endpoint: https://tauth-api.mprlab.com/oauth/consent
        authorization_request_ttl: 5m
        authorization_code_ttl: 1m
        active_signing_key_id: oauth-2026-08
        signing_keys:
          - id: oauth-2026-08
            private_key:
              resource: oauth-private
              output: oauth-signing-key
        client_metadata:
          request_timeout: 3s
          maximum_bytes: 5120
          minimum_cache_ttl: 1m
          maximum_cache_ttl: 1h
    - kind: caddy_route
      id: public-api
      hostname: tauth-api.mprlab.com
      listener: https
      handlers:
        - id: default
          path_prefix: /
          upstream: tauth.http
          transport:
            protocol: http
            dial_timeout_seconds: 10
            response_header_timeout_seconds: 30
            read_timeout_seconds: 80
      tls:
        mode: automatic
      access:
        trusted_networks:
          - 127.0.0.1/32
          - 172.19.0.0/16
          - 192.168.1.158/32
        rate_limit:
          events: 300
          window_seconds: 10
    - kind: health_check
      id: public-health
      protocol: http
      url: https://tauth-api.mprlab.com/health
      expected_status: 200
    - kind: github_pages
      id: browser-helper
      repository: tyemirov/tauth
      branch: gh-pages
      domain: tauth.mprlab.com
      url: https://tauth.mprlab.com/
      source:
        kind: container
        context: .
        dockerfile: docker/pages/Dockerfile
        target: pages
      verification:
        path: /.mprlab-release.json
